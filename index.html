<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>逆轉 BARIBARI REVERSE｜Expert 3v3 Simulator</title>
<meta name="description" content="非官方的バリバコイン Expert 3v3 瀏覽器模擬器。" />
<style>
:root{color-scheme:dark;--bg:#080a0d;--panel:#151a21;--ink:#f6f7f9;--muted:#a7b0bb;--line:#303946;--gold:#ffd45f;--red:#e15349;--blue:#4f8fe8;--green:#51c878}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
button,input{font:inherit}button{cursor:pointer;min-height:44px}
.app{height:100vh;height:100dvh;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow:hidden}
.board-wrap{min-width:0;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#19212a 0,#0b0f14 58%,#05070a 100%);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative;contain:layout paint;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.board-wrap canvas{display:block;width:100%;height:100%;min-width:0;min-height:0;touch-action:none;overscroll-behavior:none}
.game-topbar{position:absolute;z-index:5;left:10px;right:10px;top:10px;display:flex;justify-content:flex-end;pointer-events:none}.quick-restart{pointer-events:auto;min-width:44px;border:1px solid rgba(255,255,255,.16);background:rgba(12,16,21,.86);color:#fff;border-radius:8px;padding:9px 11px;font-weight:850;backdrop-filter:blur(12px)}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.card{flex:0 0 auto;background:rgba(21,26,33,.96);border:1px solid var(--line);border-radius:8px;padding:12px}.brand{font-weight:950}.brand small{display:block;color:var(--muted);font-weight:650;margin-top:4px}.status{font-size:19px;font-weight:900}.sub{color:var(--muted);font-size:12px;line-height:1.45}
.team{padding:6px 0}.team+.team{border-top:1px solid var(--line)}.team-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;font-weight:900}.team.p1 .team-head{color:#ff8d84}.team.p2 .team-head{color:#82aff2}.player{display:grid;grid-template-columns:1fr auto;gap:3px 8px;padding:5px 0;font-size:12px}.player.out{opacity:.42}.ox{font-variant-numeric:tabular-nums;text-align:right}.pill{padding:2px 7px;border-radius:999px;background:#242b35;color:#d6dde5;font-size:11px}
.log{height:150px;overflow:auto;overscroll-behavior:contain;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e12;border:1px solid var(--line);border-radius:6px;padding:8px}.log div+div{margin-top:4px}
.btn{border:1px solid #435062;background:#252d38;color:#fff;border-radius:8px;padding:10px 12px}.btn.primary{background:var(--gold);color:#111;border-color:var(--gold);font-weight:900}.btn:disabled{opacity:.42;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap}
.setup{position:fixed;inset:0;background:rgba(5,7,9,.94);backdrop-filter:blur(12px);z-index:10;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow:hidden}.setup.hidden{display:none}.setup-box{width:min(920px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;background:#12171d;border:1px solid #384453;border-radius:10px;padding:18px;-webkit-overflow-scrolling:touch}.setup-box h1{margin:0 0 4px;font-size:25px}.deck-grid{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:14px}.deck-column{min-width:0;padding:11px;background:#0d1218;border:1px solid #2d3744;border-radius:8px}.deck-column.p1{border-left:3px solid var(--red)}.deck-column.p2{border-left:3px solid var(--blue)}.deck-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:900}.deck-slots{display:grid;gap:7px}.deck-total{margin-top:8px;color:var(--muted);font-size:12px;font-weight:800}.deck-total.invalid{color:#ff776d}
.coin-card{width:100%;min-width:0;text-align:left;background:#111820;border:1px solid #344150;border-radius:7px;color:#fff;padding:9px}.coin-card strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.coin-card-grid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}.coin-card .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.setup-step{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.hidden{display:none!important}.placement-banner{position:absolute;z-index:3;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 120px);background:rgba(16,19,24,.95);border:1px solid #4b5664;border-radius:8px;padding:9px 12px;font-weight:800;font-size:12px;text-align:center;pointer-events:none}.confirm-placement{position:absolute;z-index:3;left:50%;bottom:10px;transform:translateX(-50%)}
details summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}.dev-grid{display:grid;grid-template-columns:1fr 88px;gap:8px;margin-top:9px;align-items:center}.dev-grid label{font-size:11px;color:var(--muted)}.dev-grid input,input[type=text],input[type=number]{width:100%;background:#0d1014;color:#fff;border:1px solid #39424e;border-radius:7px;padding:10px}.footer{color:#737e8a;font-size:11px;line-height:1.5}
.picker{position:fixed;inset:0;z-index:20;background:#080b0f;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overscroll-behavior:none}.picker.hidden{display:none}.picker-sheet{min-height:0;flex:1;display:flex;flex-direction:column;width:min(900px,100%);margin:auto;background:#10151b;border:1px solid #3a4654;border-radius:10px;padding:12px}.picker-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:9px}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 9px}.chip{flex:0 0 auto;white-space:nowrap;border:1px solid #445162;background:#1b222b;color:#dbe3ec;border-radius:999px;padding:8px 12px;min-height:44px}.chip.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:900}.picker-list{min-height:0;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));align-content:start;gap:8px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.picker-coin{border:1px solid #323e4d;background:#151d26;color:#fff;border-radius:7px;padding:10px;text-align:left}.picker-coin strong{display:block;font-size:14px}.picker-coin .values{margin-top:6px;font-variant-numeric:tabular-nums;color:#f4d46b}.picker-coin .set{margin-top:5px;color:#96a2af;font-size:10px;line-height:1.3}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(190px,34dvh);gap:8px;padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}.board-wrap{grid-row:1}.side{grid-row:2;display:grid;grid-template-columns:.8fr 1.2fr;align-content:start;gap:7px}.side .card{padding:8px}.side .brand-card,.side .log-card,.side details,.side .footer{display:none}.status{font-size:15px}.player{font-size:10px;padding:3px 0}.team-head{font-size:11px}.quick-restart span{display:none}.deck-grid{gap:7px}.setup-box{padding:12px}.setup-box h1{font-size:21px}.deck-column{padding:8px}.coin-card{padding:7px}.coin-card strong{font-size:11px}.coin-card .sub{font-size:9px}.picker-list{grid-template-columns:1fr 1fr}.placement-banner{max-width:calc(100% - 100px);font-size:10px;padding:7px 8px}}
@media(max-width:600px){.deck-grid{grid-template-columns:1fr}.setup{place-items:start center}.setup-box{min-height:100%}}
@media(max-width:420px){.app{grid-template-rows:minmax(0,1fr) minmax(205px,36dvh)}.deck-title{font-size:12px}.deck-total{font-size:10px}.picker-list{grid-template-columns:1fr 1fr}.picker-coin{padding:8px}.picker-coin strong{font-size:12px}.picker-coin .values{font-size:11px}}
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap" id="boardWrap">
    <div class="game-topbar"><button class="quick-restart" id="quickRestart" type="button" aria-label="重新開始">↻ <span>重新開始</span></button></div>
    <canvas id="board"></canvas>
    <div class="placement-banner hidden" id="placementBanner"></div>
    <button class="btn primary confirm-placement hidden" id="confirmPlacement">確定</button>
  </div>
  <aside class="side">
    <div class="card brand-card"><div class="brand">BARIBA SIM <small>Expert 3v3 · Hotseat</small></div></div>
    <div class="card"><div class="status" id="status">準備中</div><div class="sub" id="hint">請完成對戰設定。</div></div>
    <div class="card" id="playerCards"></div>
    <div class="card log-card"><strong>戰鬥紀錄</strong><div class="log" id="log"></div></div>
    <details class="card"><summary>開發者面板</summary><div class="dev-grid" id="devGrid"></div><div class="row" style="margin-top:10px"><button class="btn" id="newSeed">新 Seed</button><button class="btn" id="restart">重新開始</button></div></details>
    <div class="footer">非官方 fan simulator。硬幣圖像為程序繪製，不包含商品攝影。物理與翻面參數為模擬用估值。</div>
  </aside>
</div>

<div class="setup" id="setup">
  <div class="setup-box">
    <h1>Expert 3v3 對戰設定</h1>
    <p class="sub">每位玩家選擇 3 顆硬幣；deck 總 OX 不可超過 15,000。</p>
    <div class="deck-grid">
      <section class="deck-column p1"><div class="deck-title"><span>玩家 1</span><span>P1</span></div><div class="deck-slots" id="deck0"></div><div class="deck-total" id="deckTotal0"></div></section>
      <section class="deck-column p2"><div class="deck-title"><span>玩家 2</span><span>P2</span></div><div class="deck-slots" id="deck1"></div><div class="deck-total" id="deckTotal1"></div></section>
    </div>
    <div class="setup-step">
      <strong>1. 猜拳勝者</strong><div class="row" style="margin-top:8px"><button class="btn" data-janken="0">玩家 1</button><button class="btn" data-janken="1">玩家 2</button></div>
      <div id="sideStep" class="hidden" style="margin-top:12px"><strong>2. 勝者選陣營</strong><div class="row" style="margin-top:8px"><button class="btn" data-side="order">ORDER（白）</button><button class="btn" data-side="xtreme">XTREME（黑）</button></div></div>
      <div id="tossStep" class="hidden" style="margin-top:12px"><strong>3. コイントス</strong><p class="sub" id="tossInfo"></p><button class="btn primary" id="toss">旋轉硬幣決定先攻</button></div>
      <div id="startStep" class="hidden" style="margin-top:12px"><p id="startInfo"></p><button class="btn primary" id="start">開始對戰</button></div>
    </div>
  </div>
</div>
<div class="picker hidden" id="coinPicker" aria-hidden="true">
  <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="picker-head"><strong id="pickerTitle">選擇硬幣</strong><button class="btn" id="closePicker" type="button">關閉</button></div>
    <input id="pickerSearch" type="text" placeholder="搜尋名稱／稀有度／系列…" autocomplete="off">
    <div class="chips" id="pickerFilters"></div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>
<script type="module" src="./ui/ui.js"></script>
</body>
</html>
