<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>逆轉 BARIBARI REVERSE｜Expert 3v3 Simulator</title>
<meta name="description" content="非官方的バリバコイン Expert 3v3 瀏覽器模擬器。" />
<style>
:root{color-scheme:dark;--bg:#070706;--panel:#171715;--panel-2:#22211e;--ink:#f4f0e8;--muted:#aaa69d;--line:#46443f;--gold:#f5c84c;--red:#ef5147;--blue:#3b8ef7;--green:#5cc98a}
*{box-sizing:border-box;letter-spacing:0}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg)}
body{font-family:"Avenir Next","Noto Sans TC","Hiragino Sans",system-ui,sans-serif;color:var(--ink)}
button,input{font:inherit}button{cursor:pointer;min-height:44px}.hidden{display:none!important}
.app{height:100vh;height:100dvh;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow:hidden;background:repeating-linear-gradient(135deg,#090908 0,#090908 18px,#0d0c0b 18px,#0d0c0b 19px)}
.board-wrap{min-width:0;min-height:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0b0b0a;border:1px solid #555149;border-radius:6px;overflow:hidden;position:relative;contain:layout paint;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:inset 0 0 70px #000}
.board-wrap canvas{display:block;width:100%;height:100%;min-width:0;min-height:0;touch-action:none;overscroll-behavior:none}
.game-topbar{position:absolute;z-index:5;left:10px;right:10px;top:10px;display:flex;justify-content:flex-end;pointer-events:none}.quick-restart{pointer-events:auto;min-width:44px;border:1px solid #6a665d;background:#141412e8;color:#fff;border-radius:6px;padding:9px 11px;font-weight:850;backdrop-filter:blur(10px)}
.side{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.card{flex:0 0 auto;background:#171715f2;border:1px solid #3e3c37;border-radius:6px;padding:12px}.brand{font-size:20px;font-weight:950;color:var(--gold)}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-top:2px}.status{font-size:19px;font-weight:900}.sub{color:var(--muted);font-size:12px;line-height:1.45}
.team{padding:6px 0}.team+.team{border-top:1px solid var(--line)}.team-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-weight:900}.team.p1 .team-head{color:#ff9189}.team.p2 .team-head{color:#8bbcff}
.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 8px;padding:7px 0;border-left:3px solid transparent;padding-left:8px;font-size:12px}.player.unlocked,.player.flipped{border-left-color:var(--gold);background:#f5c84c0a}.player.out{opacity:.42}.player-name{min-width:0}.player-name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.state-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.state-badge,.face-badge{display:inline-flex;align-items:center;min-height:20px;padding:2px 6px;border:1px solid #57534b;border-radius:3px;color:#c7c2b8;font-size:9px;font-weight:900}.state-badge.unlocked,.state-badge.flipped{border-color:var(--gold);background:var(--gold);color:#17130a}.face-badge.order{border-color:#d7d3ca;color:#f0ede6}.face-badge.xtreme{border-color:#579cf0;color:#8dbfff}.ox{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.pill{display:inline-block;padding:2px 6px;border-radius:3px;background:#3b3626;color:#f4d77d;font-size:9px;font-weight:900}
.log{height:146px;overflow:auto;overscroll-behavior:contain;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0b0a;border:1px solid #37352f;border-radius:4px;padding:8px}.log div+div{margin-top:4px}
.btn{border:1px solid #5b5851;background:#292824;color:#fff;border-radius:6px;padding:10px 12px}.btn:hover{border-color:#8a857a}.btn:focus-visible,.coin-card:focus-visible,.picker-coin:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.btn.primary{background:var(--gold);color:#17130a;border-color:var(--gold);font-weight:900}.btn:disabled{opacity:.38;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap}
.setup{position:fixed;inset:0;background:#050504f5;z-index:10;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overflow:hidden}.setup.hidden{display:none}
.setup-box{width:min(960px,100%);height:min(650px,100%);overflow:auto;overscroll-behavior:contain;background:#151513;border:1px solid #555149;border-radius:8px;padding:18px;-webkit-overflow-scrolling:touch;box-shadow:0 28px 80px #000}.setup-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid #48453f;padding-bottom:12px}.setup-brand{color:var(--gold);font-size:12px;font-weight:950}.setup-box h1{margin:2px 0 3px;font-size:25px}.setup-versus{display:grid;grid-template-columns:auto auto auto;gap:10px;align-items:center;font-weight:950}.setup-versus span:first-child{color:var(--red)}.setup-versus span:last-child{color:var(--blue)}.setup-versus b{font-size:22px;color:var(--gold)}
.deck-grid{min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px}.deck-column{min-width:0;padding:0 0 10px}.deck-column.p1{border-bottom:3px solid var(--red)}.deck-column.p2{border-bottom:3px solid var(--blue)}.deck-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-weight:900}.deck-slots{display:grid;gap:6px}.deck-total{margin-top:7px;color:var(--muted);font-size:11px;font-weight:800}.deck-total.invalid{color:#ff776d}
.coin-card{width:100%;min-width:0;min-height:72px;text-align:left;background:#20201d;border:1px solid #494740;border-radius:5px;color:#fff;padding:8px}.coin-card-grid{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center}.slot-no{display:grid;place-items:center;width:28px;height:28px;background:#0f0f0e;border:1px solid #4d4a43;border-radius:50%;font-size:10px;font-weight:900;color:var(--muted)}.coin-copy{min-width:0}.coin-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.coin-copy .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.coin-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-variant-numeric:tabular-nums}.coin-stat{min-width:54px;padding:4px 6px;border:1px solid #4e4b44;border-radius:4px;text-align:right}.coin-stat small{display:block;font-size:8px;color:var(--muted)}.coin-stat b{font-size:12px}.coin-stat.order{border-top-color:#e7e1d6}.coin-stat.xtreme{border-top-color:var(--blue)}
.setup-console{margin-top:14px;border-top:1px solid #4a4740;padding-top:10px}.setup-track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.flow-step{padding:6px 8px;border-bottom:2px solid #403e38;color:#77736a;font-size:10px;font-weight:900}.flow-step.current{color:var(--ink);border-color:var(--gold)}.flow-step.done{color:#bdb7aa;border-color:#817a69}.setup-stage{position:relative;height:112px;background:#0e0e0d;border:1px solid #403e38;border-radius:5px;overflow:hidden}.setup-step{position:absolute;inset:0;padding:12px;display:flex;flex-direction:column;justify-content:center}.setup-step h2{margin:0 0 8px;font-size:15px}.setup-actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.setup-back{background:transparent;border-color:#45423c;color:var(--muted)}
.placement-banner{position:absolute;z-index:3;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 120px);background:#151513f2;border:1px solid #6a665d;border-radius:5px;padding:9px 12px;font-weight:800;font-size:12px;text-align:center;pointer-events:none}.confirm-placement{position:absolute;z-index:3;left:50%;bottom:10px;transform:translateX(-50%)}
.event-flash{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(360px,80%);padding:16px 20px;background:#17130aee;border:2px solid var(--gold);border-radius:6px;text-align:center;color:var(--gold);font-weight:950;box-shadow:0 0 36px #f5c84c55;pointer-events:none}.event-flash strong{display:block;color:#fff;font-size:21px;margin-bottom:3px}.event-flash.flipped{background:#261109ee;border-color:#ff745f;color:#ff9c8e;box-shadow:0 0 36px #ef514766}
details summary{cursor:pointer;font-weight:800;min-height:44px;display:flex;align-items:center}.dev-grid{display:grid;grid-template-columns:1fr 88px;gap:8px;margin-top:9px;align-items:center}.dev-grid label{font-size:11px;color:var(--muted)}.dev-grid input,input[type=text],input[type=number]{width:100%;background:#0d0d0c;color:#fff;border:1px solid #4a4741;border-radius:5px;padding:10px}.footer{color:#77736a;font-size:11px;line-height:1.5}
.picker{position:fixed;inset:0;z-index:20;background:#080807f7;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));overscroll-behavior:none}.picker.hidden{display:none}.picker-sheet{min-height:0;flex:1;display:flex;flex-direction:column;width:min(980px,100%);margin:auto;background:#151513;border:1px solid #555149;border-radius:8px;padding:12px}.picker-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:9px}.picker-head strong{font-size:18px}.chips{display:flex;gap:7px;overflow:auto;padding:7px 0 10px}.chip{flex:0 0 auto;white-space:nowrap;border:1px solid #59564f;background:#22211e;color:#d8d2c8;border-radius:5px;padding:8px 12px;min-height:40px}.chip.active{background:var(--gold);border-color:var(--gold);color:#17130a;font-weight:900}.picker-list{min-height:0;flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));align-content:start;gap:8px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.picker-coin{min-height:72px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid #4a4740;background:#20201d;color:#fff;border-radius:5px;padding:11px;text-align:left}.picker-name{min-width:0}.picker-name strong{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rarity{display:inline-block;margin-right:5px;color:var(--gold);font-weight:950}.picker-set{margin-top:6px;color:#aaa69d;font-size:10px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.face-values{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-variant-numeric:tabular-nums}.face-value{min-width:70px;padding:6px 7px;border:1px solid #555149;border-radius:4px;text-align:right}.face-value small{display:block;font-size:8px;color:#aaa69d}.face-value b{font-size:14px}.face-value.order{border-top:2px solid #ebe6dc}.face-value.xtreme{border-top:2px solid var(--blue)}
@media(prefers-reduced-motion:no-preference){.event-flash{animation:event-in .18s ease-out}@keyframes event-in{from{opacity:0;transform:translate(-50%,-50%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(205px,35dvh);gap:7px;padding:max(7px,env(safe-area-inset-top)) max(7px,env(safe-area-inset-right)) max(7px,env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}.board-wrap{grid-row:1}.side{grid-row:2;display:grid;grid-template-columns:.72fr 1.28fr;align-content:start;gap:7px}.side .card{padding:8px}.side .brand-card,.side .log-card,.side details,.side .footer{display:none}.status{font-size:15px}.player{font-size:10px;padding:4px 0 4px 6px}.team-head{font-size:11px}.quick-restart span{display:none}.setup-box{padding:12px}.setup-box h1{font-size:21px}.deck-grid{gap:12px}.coin-card-grid{grid-template-columns:24px minmax(0,1fr) auto}.slot-no{width:24px;height:24px}.placement-banner{max-width:calc(100% - 100px);font-size:10px;padding:7px 8px}}
@media(max-width:600px){.app{grid-template-rows:minmax(0,1fr) minmax(220px,38dvh)}.side{display:flex;flex-direction:column;overflow-y:auto}.side .card{width:100%}.setup{padding:0;place-items:start center}.setup-box{height:100%;border:0;border-radius:0}.setup-head{position:sticky;top:-12px;z-index:2;background:#151513;padding-top:12px}.setup-versus{display:none}.deck-grid{grid-template-columns:1fr}.coin-card{min-height:86px}.coin-card-grid{grid-template-columns:24px minmax(0,1fr)}.coin-stats{grid-column:2;width:100%}.setup-stage{height:126px}.picker{padding:0}.picker-sheet{border:0;border-radius:0}.picker-list{grid-template-columns:1fr}.picker-coin{grid-template-columns:1fr;grid-template-rows:auto auto;min-height:118px;align-content:start}.face-values{width:100%}}
@media(max-width:420px){.app{grid-template-rows:minmax(0,1fr) minmax(220px,38dvh)}.coin-copy strong{font-size:12px}.coin-stat{min-width:48px;padding:3px 4px}.flow-step{padding:5px 3px;text-align:center}.event-flash strong{font-size:17px}.face-value{min-width:58px}}
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap" id="boardWrap">
    <div class="game-topbar"><button class="quick-restart" id="quickRestart" type="button" aria-label="重新開始">↻ <span>重新開始</span></button></div>
    <canvas id="board"></canvas>
    <div class="placement-banner hidden" id="placementBanner"></div>
    <button class="btn primary confirm-placement hidden" id="confirmPlacement">確定</button>
    <div class="event-flash hidden" id="eventFlash" role="status" aria-live="assertive"></div>
  </div>
  <aside class="side">
    <div class="card brand-card"><div class="brand">BARIBA SIM <small>Expert 3v3 · Hotseat</small></div></div>
    <div class="card"><div class="status" id="status">準備中</div><div class="sub" id="hint">請完成對戰設定。</div></div>
    <div class="card" id="playerCards"></div>
    <div class="card log-card"><strong>戰鬥紀錄</strong><div class="log" id="log"></div></div>
    <details class="card"><summary>開發者面板</summary><div class="dev-grid" id="devGrid"></div><div class="row" style="margin-top:10px"><button class="btn" id="newSeed">新 Seed</button><button class="btn" id="restart">重新開始</button></div></details>
    <div class="footer">非官方 fan simulator。硬幣圖像為程序繪製，不包含商品攝影。物理與翻面參數為模擬用估值。</div>
  </aside>
</div>

<div class="setup" id="setup">
  <div class="setup-box">
    <header class="setup-head"><div><div class="setup-brand">BARIBA SIM</div><h1>Expert 3v3 對戰設定</h1><div class="sub">每位玩家選擇 3 顆硬幣；deck 總 OX 不可超過 15,000。</div></div><div class="setup-versus" aria-hidden="true"><span>P1</span><b>VS</b><span>P2</span></div></header>
    <div class="deck-grid">
      <section class="deck-column p1"><div class="deck-title"><span>玩家 1</span><span>P1</span></div><div class="deck-slots" id="deck0"></div><div class="deck-total" id="deckTotal0"></div></section>
      <section class="deck-column p2"><div class="deck-title"><span>玩家 2</span><span>P2</span></div><div class="deck-slots" id="deck1"></div><div class="deck-total" id="deckTotal1"></div></section>
    </div>
    <div class="setup-console">
      <div class="setup-track" aria-label="設定進度"><span class="flow-step current" data-flow="janken">1 猜拳</span><span class="flow-step" data-flow="side">2 陣營</span><span class="flow-step" data-flow="toss">3 先攻</span><span class="flow-step" data-flow="ready">4 開始</span></div>
      <div class="setup-stage">
        <section class="setup-step" id="jankenStep"><h2>猜拳勝者</h2><div class="row"><button class="btn" data-janken="0">玩家 1</button><button class="btn" data-janken="1">玩家 2</button></div></section>
        <section class="setup-step hidden" id="sideStep"><h2>勝者選擇陣營</h2><div class="setup-actions"><button class="btn setup-back" data-setup-back="janken">返回</button><div class="row"><button class="btn" data-side="order">ORDER（白）</button><button class="btn" data-side="xtreme">XTREME（黑）</button></div></div></section>
        <section class="setup-step hidden" id="tossStep"><h2>コイントス決定先攻</h2><div class="setup-actions"><button class="btn setup-back" data-setup-back="side">返回</button><div><div class="sub" id="tossInfo"></div><button class="btn primary" id="toss">旋轉硬幣</button></div></div></section>
        <section class="setup-step hidden" id="startStep"><h2>對戰準備完成</h2><div class="setup-actions"><button class="btn setup-back" data-setup-back="toss">返回</button><div><div id="startInfo"></div><button class="btn primary" id="start">開始對戰</button></div></div></section>
      </div>
    </div>
  </div>
</div>
<div class="picker hidden" id="coinPicker" aria-hidden="true">
  <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="picker-head"><strong id="pickerTitle">選擇硬幣</strong><button class="btn" id="closePicker" type="button">關閉</button></div>
    <input id="pickerSearch" type="text" placeholder="搜尋名稱／稀有度／系列…" autocomplete="off">
    <div class="chips" id="pickerFilters"></div>
    <div class="picker-list" id="pickerList"></div>
  </div>
</div>
<script type="module" src="./ui/ui.js"></script>
</body>
</html>
